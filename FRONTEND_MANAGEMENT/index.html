<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: url("../images/emp.png") no-repeat center center;
            background-size: cover;
            height: 100vh;
        }
    </style>
</head>

<body>

    <div class="container h-100 d-flex justify-content-center align-items-center">

        <div class="card shadow-lg p-4 text-center" style="width: 400px;">
            <div class="card-body">

                <h2 class="mb-3">Hello! Users</h2>

                <p class="text-muted mb-4">
                    Are you want to  <strong>SIGN IN</strong> or <strong>LOGIN</strong>?
                </p>

                <div class="d-grid gap-3">
                    <button class="btn btn-primary" id="admin">SIGN IN </button>
                    <button class="btn btn-success" id="employee">LOGIN IN</button>
                </div>

            </div>
        </div>

    </div>
 <script src="index.js"></script>
</body>

</html>
